services:
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-admin-api
      - --web.enable-lifecycle
      - --storage.tsdb.retention.time=7d
      - --web.config.file=/etc/prometheus/web-config.yml
    container_name: prometheus
    image: prom/prometheus:v3.11.2
    env_file:
      - .env
    networks:
      shared: null
    ports:
      - protocol: tcp
        published: ${PROMETHEUS_PORT:-9090}
        target: 9090
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/web-config.yml:/etc/prometheus/web-config.yml:ro
      - ./prometheus/certs/:/etc/prometheus/certs/:ro
  telegraf:
    build: ./telegraf
    container_name: telegraf
    links:
      - prometheus
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/hostfs/proc
    privileged: true
    restart: always
    env_file:
      - .env
    networks:
      shared: null
  grafana:
    container_name: grafana
    image: grafana/grafana:12.4.3
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /opt/grafana/dashboards/TunnelStats.json
    ports:
      - ${GRAFANA_PORT}:${GRAFANA_PORT}
    links:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_logs:/var/log/grafana
      - grafana_plugins:/var/lib/grafana/plugins
      - ./grafana/provisioning/datasources/tunnel/:/etc/grafana/provisioning/datasources/:ro
      - ./grafana/provisioning/dashboard/:/opt/grafana/dashboards/:rw
      - ./grafana/provisioning/dashboard/:/etc/grafana/provisioning/dashboards/:rw
      - ./grafana/provisioning/alerting/:/etc/grafana/provisioning/alerting/:rw
    restart: always
    env_file:
      - .env
      - prometheus/generated.env
    networks:
      shared: null
  loki:
    command: -config.file=/etc/loki/loki-config.yml
    container_name: loki
    image: grafana/loki:3.6.10
    networks:
      shared: null
    ports:
      - protocol: tcp
        published: 3100
        target: 3100
    restart: always
    volumes:
      - ./loki/loki-config-filesystem.yml:/etc/loki/loki-config.yml:ro
      - /home/loki/:/home/loki/
  alloy:
    command: run --stability.level=experimental /etc/alloy/config.alloy
    container_name: alloy
    image: grafana/alloy:v1.15.1
    depends_on:
      - loki
    networks:
      shared: null
    ports:
      - protocol: tcp
        published: 514
        target: 514
      - protocol: udp
        published: 514
        target: 514
    restart: always
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
networks:
  shared: {}
volumes:
  grafana_data:
  grafana_logs:
  grafana_plugins:

